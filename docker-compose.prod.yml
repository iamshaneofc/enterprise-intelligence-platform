version: "3.8"

# ==============================================================================
# Enterprise Intelligence Platform - Dedicated Production Docker Compose
# Connects directly to AWS RDS PostgreSQL (No local DB container)
# ==============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: eip_backend
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set (AWS RDS connection string)}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - OPENAI_API_KEY=${OPENAI_API_KEY:?OPENAI_API_KEY must be set}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - FALLBACK_LLM_PROVIDER=${FALLBACK_LLM_PROVIDER:-anthropic}
      - STORAGE_DIR=/app/storage/documents
      - USE_FAKE_LLM=false
      - USE_FAKE_EMBEDDINGS=false
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
      - LANGFUSE_ENABLED=${LANGFUSE_ENABLED:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS must be set}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
    ports:
      # Internal loopback only; exposed externally via Nginx reverse proxy
      - "127.0.0.1:8000:8000"
    volumes:
      - document_storage:/app/storage/documents
    deploy:
      resources:
        limits:
          memory: 750M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  document_storage:
