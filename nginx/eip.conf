# ==============================================================================
# Enterprise Intelligence Platform - Production Nginx Reverse Proxy Configuration
# Target: /etc/nginx/sites-available/eip (symlinked to /etc/nginx/sites-enabled/eip)
# ==============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Maximum document upload size (FastAPI enforces 50 MB; allow 55 MB for payload overhead)
    client_max_body_size 55M;

    # Timeouts for long-running LLM generation and autonomous agent investigation loops
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    send_timeout 120s;

    # Reverse proxy to FastAPI application listening on internal loopback
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets & streaming headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Disable response buffering for responsive streaming responses
        proxy_buffering off;
        proxy_cache off;
    }

    # Liveness health probe endpoint (zero-overhead logging)
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    # Readiness health probe endpoint
    location /ready {
        proxy_pass http://127.0.0.1:8000/ready;
        access_log off;
    }
}
